services:
  - type: web
    name: projectflow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 2 --timeout 60 wsgi:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER
        value: "true"

# DATABASE_URL deve ser configurada manualmente no painel do Render
# usando a connection string privada do Neon.
