services:
  - type: web
    name: projectflow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: projectflow-db
          property: connectionString

databases:
  - name: projectflow-db
    plan: free
