{% extends "base.html" %}
{% block content %}
<header class="page-header"><div><span class="eyebrow">{{ project.name }}</span><h1>{{ 'Editar tarefa' if task else 'Nova tarefa' }}</h1></div></header>
<div class="panel form-panel">
<form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Título<input name="title" required value="{{ task.title if task else '' }}"></label>
  <label>Descrição<textarea name="description" rows="4">{{ task.description if task else '' }}</textarea></label>
  <div class="form-grid">
    <label>Prioridade<select name="priority">{% for p in ['Baixa','Média','Alta'] %}<option {% if task and task.priority==p %}selected{% endif %}>{{p}}</option>{% endfor %}</select></label>
    <label>Status<select name="status">{% for s in ['Pendente','Em andamento','Concluída'] %}<option {% if task and task.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select></label>
    <label>Prazo<input type="date" name="due_date" value="{{ task.due_date.isoformat() if task and task.due_date else '' }}"></label>
  </div>
  <button class="btn primary">Salvar tarefa</button>
</form>
</div>
{% if task %}
<form method="post" action="{{ url_for('main.task_delete', task_id=task.id) }}" onsubmit="return confirm('Excluir tarefa?')">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn danger">Excluir tarefa</button></form>
{% endif %}
{% endblock %}
