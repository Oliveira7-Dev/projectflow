{% extends "base.html" %}
{% block title %}Recuperar senha | ProjectFlow{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="brand big">⚡ ProjectFlow</div>
  <h1>Recuperar senha</h1>
  <p>Informe seu e-mail. Se houver uma conta cadastrada, enviaremos um link de recuperação.</p>

  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>
      E-mail
      <input type="email" name="email" required autocomplete="email" placeholder="voce@email.com">
    </label>
    <button class="btn primary" type="submit">Enviar link de recuperação</button>
  </form>

  <p class="muted"><a href="{{ url_for('auth.login') }}">← Voltar para o login</a></p>
</div>
{% endblock %}
